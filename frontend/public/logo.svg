<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" stroke="white" stroke-linecap="round" stroke-linejoin="round">
  <!-- Grid backdrop dots (subtle) -->
  <circle cx="20" cy="20" r="1" opacity="0.2" fill="white" stroke="none" />
  <circle cx="50" cy="20" r="1" opacity="0.2" fill="white" stroke="none" />
  <circle cx="80" cy="20" r="1" opacity="0.2" fill="white" stroke="none" />
  <circle cx="20" cy="50" r="1" opacity="0.2" fill="white" stroke="none" />
  <circle cx="80" cy="50" r="1" opacity="0.2" fill="white" stroke="none" />
  <circle cx="20" cy="80" r="1" opacity="0.2" fill="white" stroke="none" />
  <circle cx="50" cy="80" r="1" opacity="0.2" fill="white" stroke="none" />
  <circle cx="80" cy="80" r="1" opacity="0.2" fill="white" stroke="none" />

  <!-- Bezier Curve Path -->
  <path d="M 20 75 C 20 30, 80 30, 80 75" stroke-width="3" opacity="0.9" />
  
  <!-- Anchor Control Lines -->
  <line x1="20" y1="75" x2="20" y2="30" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.5" />
  <line x1="80" y1="75" x2="80" y2="30" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.5" />

  <!-- Control Handle Points -->
  <circle cx="20" cy="30" r="2.5" fill="none" stroke-width="1.5" />
  <circle cx="80" cy="30" r="2.5" fill="none" stroke-width="1.5" />

  <!-- Main Anchor Points (filled) -->
  <rect x="17.5" y="72.5" width="5" height="5" fill="white" stroke-width="1.5" />
  <rect x="77.5" y="72.5" width="5" height="5" fill="white" stroke-width="1.5" />

  <!-- Curve Handle Peak Node -->
  <circle cx="50" cy="41.25" r="3" fill="#00f5d4" stroke="#00f5d4" stroke-width="1" />

  <!-- Stylized Pen Tool Nib tip -->
  <path d="M 50 41.25 L 35 25 L 43 20 L 50 28 L 57 20 L 65 25 Z" fill="none" stroke-width="2" />
  <line x1="50" y1="41.25" x2="50" y2="28" stroke-width="1.5" />
</svg>
